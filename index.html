<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Студентски помощник</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Caveat:wght@600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone app, sticky bottom tab bar, cards only where an object is tappable */
:root{
  /* the two theme colours the person picks in Настройки; everything else is mixed from them */
  --ua:#d63a72; --ub:#8e3fa8; --ua-ink:#ffffff;
  --accent:var(--ua); --accent2:var(--ub);
  --bg:color-mix(in srgb,var(--ua) 6%,#fffafb); --surface:#ffffff; --surface-2:color-mix(in srgb,var(--ua) 11%,#ffffff);
  --fg:color-mix(in srgb,var(--ua) 22%,#1a1216); --muted:color-mix(in srgb,var(--ua) 30%,#6e6268); --line:color-mix(in srgb,var(--ua) 18%,#f1ecee);
  --accent-ink:var(--ua-ink); --accent-soft:color-mix(in srgb,var(--ua) 22%,#ffffff);
  --dotc:color-mix(in srgb,var(--ub) 24%,#ffffff); --tape:color-mix(in srgb,var(--ub) 35%,#ffffff);
  --sticker-a:color-mix(in srgb,var(--ua) 14%,#ffffff); --sticker-b:color-mix(in srgb,var(--ub) 16%,#ffffff); --polaroid:#ffffff;
  --good:#23845a; --warn:#b36b00; --bad:#c2263f;
  --c1:#d63a72; --c2:#8e3fa8; --c3:#e98a4f; --c4:#3f7fb0; --c5:#c9a227; --c6:#5a9d7c; --c7:#b0567a; --c8:#8a7a86;
  --display:"Unbounded",system-ui,sans-serif; --hand:"Caveat","Segoe Print","Bradley Hand",cursive; --body:"Manrope",system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --accent:color-mix(in srgb,var(--ua) 70%,#ffffff); --accent2:color-mix(in srgb,var(--ub) 66%,#ffffff);
  --bg:color-mix(in srgb,var(--ua) 9%,#120d10); --surface:color-mix(in srgb,var(--ua) 11%,#1b1418); --surface-2:color-mix(in srgb,var(--ua) 17%,#221a1e);
  --fg:color-mix(in srgb,var(--ua) 9%,#fbf6f8); --muted:color-mix(in srgb,var(--ua) 30%,#b4a8ae); --line:color-mix(in srgb,var(--ua) 24%,#2a2226);
  --accent-ink:#1a0e14; --accent-soft:color-mix(in srgb,var(--ua) 32%,#1b1418);
  --dotc:color-mix(in srgb,var(--ub) 26%,#120d10); --tape:color-mix(in srgb,var(--ub) 45%,#1b1418);
  --sticker-a:color-mix(in srgb,var(--ua) 26%,#1b1418); --sticker-b:color-mix(in srgb,var(--ub) 28%,#1b1418); --polaroid:color-mix(in srgb,var(--ua) 14%,#241c20);
  --good:#5fd394; --warn:#f2b552; --bad:#ff7088;
  --c1:#ff6fa2; --c2:#c88ae0; --c3:#f4a676; --c4:#79b2de; --c5:#e6c55a; --c6:#7fc8a3; --c7:#e58ab0; --c8:#b5a5b0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --accent:color-mix(in srgb,var(--ua) 70%,#ffffff); --accent2:color-mix(in srgb,var(--ub) 66%,#ffffff);
  --bg:color-mix(in srgb,var(--ua) 9%,#120d10); --surface:color-mix(in srgb,var(--ua) 11%,#1b1418); --surface-2:color-mix(in srgb,var(--ua) 17%,#221a1e);
  --fg:color-mix(in srgb,var(--ua) 9%,#fbf6f8); --muted:color-mix(in srgb,var(--ua) 30%,#b4a8ae); --line:color-mix(in srgb,var(--ua) 24%,#2a2226);
  --accent-ink:#1a0e14; --accent-soft:color-mix(in srgb,var(--ua) 32%,#1b1418);
  --dotc:color-mix(in srgb,var(--ub) 26%,#120d10); --tape:color-mix(in srgb,var(--ub) 45%,#1b1418);
  --sticker-a:color-mix(in srgb,var(--ua) 26%,#1b1418); --sticker-b:color-mix(in srgb,var(--ub) 28%,#1b1418); --polaroid:color-mix(in srgb,var(--ua) 14%,#241c20);
  --good:#5fd394; --warn:#f2b552; --bad:#ff7088;
  --c1:#ff6fa2; --c2:#c88ae0; --c3:#f4a676; --c4:#79b2de; --c5:#e6c55a; --c6:#7fc8a3; --c7:#e58ab0; --c8:#b5a5b0;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.pill.hot{background:var(--accent);color:var(--accent-ink)}
.pill.live{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.heart{border:0;background:transparent;font-size:1.3rem;line-height:1;color:var(--line);padding:4px;flex:none}
.heart.on{color:var(--accent)}
.lnk{color:var(--accent);font-weight:700;font-size:.85rem;text-decoration:none}
.lnk:hover{text-decoration:underline}
.deal .t{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
html,body{height:100%}
body{background-color:var(--bg);background-image:radial-gradient(var(--dotc) 1.2px,transparent 1.3px);background-size:22px 22px;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:26px}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:4px;left:calc(50% + 4px);min-width:17px;height:17px;border-radius:9px;background:var(--accent2);color:var(--bg);font-size:.66rem;font-weight:800;display:grid;place-items:center;padding:0 4px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.swatch{display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;font-weight:600;font-size:.88rem;text-align:left}
.swatch[aria-pressed="true"]{border-color:var(--fg);box-shadow:2px 2px 0 var(--line)}
.swatch .sw{width:26px;height:26px;border-radius:50%;flex:none}
input[type=color]{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px;cursor:pointer}
.tick{display:flex;gap:10px;align-items:center;font-weight:600}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin:0}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:20px 6px 20px 20px;padding:12px 10px;box-shadow:3px 4px 0 var(--line);display:flex;flex-direction:column;gap:6px}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-h span{text-align:center;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cd{aspect-ratio:1;max-width:100%;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;min-width:0}
.cd.blank{visibility:hidden}
.cd .n{font-size:.92rem;font-weight:600}
.cd.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cd.today .n{color:var(--accent);font-weight:800}
.cd:hover{background:var(--surface-2)}
.cd[aria-pressed="true"],.cd[aria-pressed="true"]:hover{background:var(--accent);color:var(--accent-ink)}
.cd[aria-pressed="true"] .n{color:inherit}
.dots{display:flex;gap:3px;height:6px}
.dots i,.legend i{width:6px;height:6px;border-radius:50%;display:inline-block}
.d-ev{background:var(--accent2)} .d-dl{background:var(--accent)} .d-py{background:var(--warn)}
.cd[aria-pressed="true"] .dots i{background:var(--accent-ink)}
.legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--muted);padding:4px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .btn{margin-left:auto}
.bell{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.bell.ev{color:var(--accent2);background:color-mix(in srgb,var(--accent2) 18%,var(--surface))}
.bell svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.stat,.grid .cloth{transition:none}}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em;display:inline;background:linear-gradient(transparent 58%,var(--accent-soft) 58%,var(--accent-soft) 92%,transparent 92%);padding:0 4px;margin-left:-4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
h2{font-family:var(--hand);font-weight:700;font-size:1.65rem;line-height:1;color:var(--accent);margin:0 0 2px;transform:rotate(-1.5deg);transform-origin:left;align-self:flex-start}
section:nth-of-type(even) > h2{transform:rotate(1deg);color:var(--accent2)}
.sub{color:var(--muted);margin:8px 0 0;font-size:.92rem}
section{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}

.btn{border:0;border-radius:999px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.ghost{background:var(--accent-soft);color:var(--fg)}
.btn.plain{background:transparent;color:var(--accent);padding:6px 8px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:7px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;color:var(--fg)}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;white-space:nowrap;font-weight:600}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px 6px 18px 18px;overflow:hidden;box-shadow:3px 4px 0 var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .m{color:var(--muted);font-size:.85rem}
.empty{border:2px dashed var(--line);border-radius:6px 20px 6px 20px;padding:18px;color:var(--muted);text-align:center;font-size:.92rem;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.empty b{color:var(--fg)}
.pill{font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.time{font-family:var(--mono);font-size:.85rem;color:var(--muted);width:48px;flex:none;line-height:1.3}
.kind{width:4px;align-self:stretch;border-radius:4px;background:var(--accent);flex:none}
.kind.ex,.kind.ev{background:var(--accent2)}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:transparent;flex:none;display:grid;place-items:center;font-size:.8rem;color:var(--accent-ink)}
.check.on{background:var(--accent);border-color:var(--accent)}
.done .t{text-decoration:line-through;color:var(--muted)}

/* budget */
.total{display:flex;flex-direction:column;gap:8px;padding:20px;border-radius:30px 8px 30px 8px;background:var(--fg);color:var(--bg);position:relative;transform:rotate(-.6deg)}
.total::after{content:"";position:absolute;right:-8px;top:-10px;width:44px;height:44px;border-radius:50%;background:var(--accent2);opacity:.9}
.total .big{font-family:var(--display);font-size:2rem;font-weight:700;letter-spacing:-.02em}
.total .lbl{opacity:.75;font-size:.85rem}
.bar{height:8px;border-radius:8px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.bar.over i{background:var(--bad)}
.cats{display:flex;flex-direction:column;gap:9px}
.cat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.9rem}
.cat .track{grid-column:1/-1;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.cat .track i{display:block;height:100%;border-radius:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.month{display:flex;align-items:center;gap:8px}
.month span{font-weight:700;min-width:120px;text-align:center;text-transform:capitalize}

/* wardrobe */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 12px;padding-top:4px}
.grid .cloth{background:var(--polaroid);padding:6px 6px 8px;border-radius:4px;box-shadow:0 3px 10px color-mix(in srgb,var(--fg) 14%,transparent);transform:rotate(-1.6deg);transition:transform .15s}
.grid .cloth:nth-child(3n+2){transform:rotate(1.4deg)}.grid .cloth:nth-child(3n){transform:rotate(-.4deg) translateY(4px)}
.grid .cloth:hover{transform:rotate(0) scale(1.03)}
.grid .cloth .ph{border-radius:2px}
.grid .cloth .t{font-family:var(--hand);font-size:1.15rem;font-weight:700;text-align:center}
.cloth{border:0;padding:0;background:transparent;display:flex;flex-direction:column;gap:5px;text-align:left;min-width:0}
.ph{aspect-ratio:3/4;width:100%;max-width:100%;border-radius:14px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .ini{font-family:var(--display);font-size:1.6rem;color:var(--accent)}
.ph .tag{position:absolute;left:6px;bottom:6px;font-size:.68rem;font-weight:700;background:var(--surface);color:var(--fg);padding:2px 7px;border-radius:999px}
.cloth .t{font-size:.85rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.outfit{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.outfit .cloth .t{font-size:.8rem}
.ofcard{background:var(--surface);border:1px solid var(--line);border-radius:8px 24px 24px 24px;padding:18px 14px 14px;display:flex;flex-direction:column;gap:12px;position:relative;box-shadow:3px 4px 0 var(--line)}
.ofcard::before,.board::before{content:"";position:absolute;top:-9px;left:50%;width:84px;height:20px;background:var(--tape);opacity:.85;transform:translateX(-50%) rotate(-3deg);border-radius:2px}
.hint{font-size:.85rem;color:var(--muted)}
.board{position:relative;display:grid;grid-template-columns:2fr 1fr;grid-template-rows:150px 150px 120px;grid-template-areas:"top outer" "bottom outer" "shoes acc";gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px}
.board.dress{grid-template-areas:"top outer" "top outer" "shoes acc"}
.board.dress .slot-bottom{display:none}
.slot{position:relative;border-radius:14px;background:var(--surface-2);overflow:hidden;min-width:0;display:grid;place-items:center}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .lbl{position:absolute;top:6px;left:6px;font-size:.68rem;font-weight:700;background:var(--surface);padding:2px 7px;border-radius:999px;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .none{color:var(--muted);font-size:.78rem;text-align:center;padding:0 8px}
.slot .ini{font-family:var(--display);font-size:1.4rem;color:var(--accent)}
.slot .arr{position:absolute;bottom:6px;width:30px;height:30px;border-radius:50%;border:0;background:var(--surface);color:var(--fg);font-size:1.1rem;font-weight:700;display:grid;place-items:center;box-shadow:0 2px 8px color-mix(in srgb,#000 15%,transparent)}
.slot .arr.l{left:6px}.slot .arr.r{right:6px}
.saved{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.combo{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.collage{display:grid;grid-template-columns:1fr 1fr;gap:4px;border:0;padding:0;background:transparent;width:100%}
.collage span{aspect-ratio:1;border-radius:8px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;font-family:var(--display);color:var(--accent)}
.collage img{width:100%;height:100%;object-fit:cover}
.combo .t{font-weight:700;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* today */
.today-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:4px 2px}
.stat{background:var(--sticker-a);border:0;border-radius:4px 18px 4px 18px;padding:14px;display:flex;flex-direction:column;gap:2px;text-align:left;transform:rotate(-1.8deg);box-shadow:2px 3px 0 color-mix(in srgb,var(--fg) 12%,transparent);transition:transform .15s}
.stat:nth-child(2){background:var(--sticker-b);transform:rotate(1.5deg) translateY(4px)}
.stat:hover{transform:rotate(0)}
.stat .v{font-family:var(--display);font-weight:700;font-size:1.2rem}
.stat .k{color:var(--muted);font-size:.8rem}

/* add bar */
.addbar{display:flex;gap:8px}
.addbar input{flex:1;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.82rem;font-weight:700;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
nav.tabs .in{pointer-events:auto;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr);height:var(--nav-h);background:var(--fg);border-radius:24px;padding:0 4px;box-shadow:0 8px 24px color-mix(in srgb,var(--fg) 30%,transparent)}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.58rem;font-weight:700;position:relative;min-width:0;color:color-mix(in srgb,var(--bg) 65%,transparent);border-radius:16px;margin:6px 1px;transition:background .15s,color .15s}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));z-index:21;width:58px;height:58px;border-radius:20px 20px 20px 6px;transform:rotate(-6deg);border:0;background:var(--accent);color:var(--accent-ink);font-size:1.8rem;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet h3{font-family:var(--display);font-size:1.1rem;margin:0}
.sheet .big-photo{max-height:300px;aspect-ratio:auto}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:.88rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

<script>
(function(){
"use strict";
// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const todayISO = () => iso(new Date());
const daysUntil = s => Math.round((parse(s) - parse(todayISO()))/86400000);
const weekday = d => ((d.getDay()+6)%7)+1; // Пн=1 … Нд=7
const DAYS = ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
const eur = new Intl.NumberFormat("bg-BG",{style:"currency",currency:"EUR"});
const money = n => eur.format(n||0);
const fmtDate = (s,opt) => parse(s).toLocaleDateString("bg-BG",opt||{day:"numeric",month:"short"});
const rid = () => Math.random().toString(36).slice(2,10);
const ls = { get(k,d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

const CATS = [
  ["Храна","--c1"],["Транспорт","--c4"],["Кафе","--c3"],["Забавления","--c2"],
  ["Университет","--c6"],["Дрехи","--c7"],["Сметки","--c5"],["Друго","--c8"]];
const catColor = c => "var(" + ((CATS.find(x=>x[0]===c)||CATS[7])[1]) + ")";
const CLOTH_CATS = ["Горнище","Долнище","Рокля","Връхна дреха","Обувки","Аксесоар"];
const WARMTH = ["всякакво","лято","преходно","зима"];
const STYLES = ["уни","ежедневно","спорт","официално"];
const DL_KINDS = ["Изпит","Протокол","Контролно","Курсова","Друго"];

// ---------- state ----------
const S = { expenses:[], classes:[], deadlines:[], shopping:[], clothes:[], outfits:[], events:[], recurring:[], deals:[], settings:{limit:0} };
const DEAL_CATS = [["Ресторант","--c3"],["Бар","--c2"],["Клуб","--c1"],["Кафе","--c5"],["Кино","--c4"],["Друго","--c8"]];
let dealFilter = "Всички", dealDay = weekday(new Date());
const loaded = new Set(), attempted = new Set();
let calMonth = new Date(); calMonth.setDate(1);
let calSel = iso(new Date());
let onSheetClose = null;
const EV_KINDS = ["Лично","Уни","Рожден ден","Среща","Друго"];
const PRESETS = [
  {name:"Розово", a:"#d63a72", b:"#8e3fa8"},
  {name:"Розово и синьо", a:"#d9447f", b:"#2f74c0"},
  {name:"Лавандула", a:"#7c4fd6", b:"#d63a72"},
  {name:"Море", a:"#1f6fb2", b:"#13a094"},
  {name:"Праскова", a:"#e0663f", b:"#d63a72"},
  {name:"Мента", a:"#178a6a", b:"#d9447f"}];
const REC_QUICK = [["Наем","Сметки"],["Карта за транспорт","Транспорт"],["Телефон","Сметки"],["Интернет","Сметки"],["Spotify","Забавления"],["Netflix","Забавления"],["Фитнес","Друго"]];
const ICON_PALETTE = '<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.9-.7-1.3-.7-2.1 0-.9.7-1.6 1.6-1.6H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="15" cy="7.5" r="1"/></svg>';
const ICON_BELL = '<svg viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>';
const ICON_CAL = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
let tab = "today";
let month = new Date(); month.setDate(1);
let uniMode = "schedule";
let uniDay = Math.min(weekday(new Date()), 7);
let closetFilter = "Всички";
let closetMode = "clothes";
let builder = {acc:null, outer:null, top:null, bottom:null, shoes:null};
let naming = false;
const SLOTS = [["top",["Горнище","Рокля"],"Горнище или рокля"],["bottom",["Долнище"],"Долнище"],["shoes",["Обувки"],"Обувки"],["outer",["Връхна дреха"],"Връхна дреха"],["acc",["Аксесоар"],"Аксесоар"]];
const slotOf = cat => (SLOTS.find(s=>s[1].includes(cat))||[])[0];
let weather = ls.get("sp-weather","хладно");
let occasion = null; // null = автоматично
let outfit = null;
let app = null, settingsRef = null, assets = null, loading = true, offline = false;

// ---------- data layer ----------
async function add(coll, data){
  if (app) return app.collection(coll).add(data);
  S[coll].push({id:rid(), ...data}); render();
}
async function upd(coll, id, patch){
  if (app) return app.collection(coll).doc(id).update(patch);
  const it = S[coll].find(x=>x.id===id); if (it) Object.assign(it, patch); render();
}
async function del(coll, id){
  if (app) return app.collection(coll).doc(id).delete();
  S[coll] = S[coll].filter(x=>x.id!==id); render();
}
async function saveSettings(patch){
  S.settings = {...S.settings, ...patch};
  if (settingsRef) await settingsRef.set(S.settings); else render();
}
async function safe(p, okMsg){
  try { await p; if (okMsg) toast(okMsg); }
  catch(e){ toast(e && e.code==="quota_exceeded" ? "Мястото за данни е запълнено. Изтрий стари записи." : "Не успях да запазя. Провери връзката и опитай пак."); }
}

async function boot(){
  applyTheme();
  render();
  const timer = setTimeout(()=>{ if (loading){ offline = true; render(); } }, 10000);
  try{
    const claude = window.claude;
    if (!claude || !claude.use){ throw 0; }
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    const uid = user ? await user.id() : null;
    if (!db || !uid){ throw 0; }
    assets = await claude.use("assets");
    app = db.doc("data/users/"+uid+"/app");
    settingsRef = db.doc("data/users/"+uid+"/settings");
    let pending = 10;
    const ready = () => { if (--pending===0 || pending<0){ loading=false; offline=false; clearTimeout(timer); } };
    const onErr = () => { loading=false; offline=true; render(); };
    for (const coll of ["expenses","classes","deadlines","shopping","clothes","outfits","events","recurring","deals"]){
      let first = true;
      app.collection(coll).onSnapshot(snap=>{
        S[coll] = snap.docs.map(d=>({id:d.id, ...d.data()}));
        if (first && !snap.metadata.fromCache){ first=false; ready(); }
        if (!snap.metadata.fromCache) loaded.add(coll);
        syncRecurring();
        render();
      }, onErr);
    }
    let firstS = true;
    settingsRef.onSnapshot(snap=>{
      S.settings = snap.exists ? {...snap.data()} : {limit:0};
      applyTheme();
      if (firstS && !snap.metadata.fromCache){ firstS=false; ready(); }
      render();
    }, onErr);
  }catch(e){
    clearTimeout(timer); loading=false; app=null; offline="local"; render();
  }
}

// ---------- UI primitives ----------
let toastT;
function toast(msg){
  let el = $("#toast"); if (!el){ el=document.createElement("div"); el.id="toast"; el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2200);
}
function openSheet(title, html, mount){
  onSheetClose = null;
  const root = $("#sheet-root");
  root.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="row between"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Затвори">✕</button></div>${html}</div></div>`;
  const scrim = $("#scrim");
  scrim.addEventListener("click", e=>{ if (e.target===scrim || e.target.closest("[data-close]")) closeSheet(); });
  if (mount) mount(scrim.querySelector(".sheet"));
  const f = scrim.querySelector("input,select"); if (f && f.type!=="file") setTimeout(()=>f.focus(),50);
}
function closeSheet(){ const f=onSheetClose; onSheetClose=null; $("#sheet-root").innerHTML=""; if (f) f(); }
function chipsHTML(name, options, current){
  return `<div class="chips" data-chipgroup="${name}">${options.map(o=>`<button type="button" class="chip" data-val="${esc(o)}" aria-pressed="${o===current}">${esc(o)}</button>`).join("")}</div>`;
}
function wireChips(root){
  root.querySelectorAll("[data-chipgroup]").forEach(g=>{
    g.addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(!b) return;
      g.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c===b)); });
  });
}
const chipVal = (root,name) => { const b = root.querySelector(`[data-chipgroup="${name}"] .chip[aria-pressed="true"]`); return b ? b.dataset.val : null; };
const photoURL = c => c.photo ? "/_blob/"+c.photo : null;
function clothTile(c, extra){
  const u = photoURL(c);
  return `<button class="cloth" data-cloth="${c.id}">
    <div class="ph">${u?`<img src="${u}" alt="${esc(c.name)}" loading="lazy" onerror="this.remove()">`:""}<span class="ini">${esc((c.name||"?")[0].toUpperCase())}</span>${extra||""}</div>
    <span class="t">${esc(c.name)}</span></button>`;
}
// make image cover the initial letter
document.addEventListener("load", e=>{ if (e.target.tagName==="IMG" && e.target.parentElement.classList.contains("ph")){ const i=e.target.parentElement.querySelector(".ini"); if(i) i.hidden=true; } }, true);

// ---------- outfit logic ----------
const lastWornDays = c => c.lastWorn ? daysUntil(c.lastWorn) * -1 : 999;
function pickWeighted(list){
  if (!list.length) return null;
  const w = list.map(c=>1+Math.min(lastWornDays(c),60));
  let r = Math.random()*w.reduce((a,b)=>a+b,0);
  for (let i=0;i<list.length;i++){ r-=w[i]; if (r<=0) return list[i]; }
  return list[list.length-1];
}
function autoOccasion(){ return todaysClasses().length ? "уни" : "ежедневно"; }
function makeOutfit(){
  const occ = occasion || autoOccasion();
  const warmOK = {"студено":["зима","преходно","всякакво"],"хладно":["преходно","всякакво","зима"],"топло":["лято","всякакво","преходно"],"дъжд":["преходно","зима","всякакво"]}[weather];
  const pool = S.clothes.filter(c=>warmOK.includes(c.warmth||"всякакво"));
  const styleOK = c => c.style===occ || (occ==="уни"&&c.style==="ежедневно") || (occ==="ежедневно"&&c.style==="уни");
  const pick = cat => { const all = pool.filter(c=>c.cat===cat); const pref = all.filter(styleOK); return pickWeighted(pref.length?pref:all); };
  const items = [];
  const dress = (weather!=="студено" && Math.random()<0.35) ? pick("Рокля") : null;
  if (dress) items.push(dress); else { items.push(pick("Горнище")); items.push(pick("Долнище")); }
  if (weather!=="топло") items.push(pick("Връхна дреха"));
  items.push(pick("Обувки"));
  outfit = { ids: items.filter(Boolean).map(c=>c.id), occ };
}
function outfitItems(){ return outfit ? outfit.ids.map(id=>S.clothes.find(c=>c.id===id)).filter(Boolean) : []; }
function outfitCard(){
  const occ = occasion || autoOccasion();
  if (!S.clothes.length) return `<div class="empty">Добави любимите си дрехи в <b>Гардероб</b> и тук всеки ден ще виждаш предложение за тоалет.</div>`;
  if (!outfit || outfit.occ!==occ || outfitItems().length!==outfit.ids.length) makeOutfit();
  const items = outfitItems();
  const cls = todaysClasses();
  let hint = "";
  if (cls.length){ const span = toMin(cls[cls.length-1].end) - toMin(cls[0].start);
    hint = span>=360 ? `Днес си в университета от ${cls[0].start} до ${cls[cls.length-1].end}. Удобните обувки ще са ти приятел.` : `Днес имаш ${cls.length} ${cls.length===1?"час":"часа"} в университета.`; }
  if (weather==="дъжд") hint = (hint?hint+" ":"") + "Вземи чадър.";
  const missing = [];
  if (!items.some(c=>c.cat==="Обувки")) missing.push("обувки");
  if (!items.some(c=>c.cat==="Горнище"||c.cat==="Рокля")) missing.push("горнища");
  return `<div class="ofcard">
    ${chipsHTML("weather",["студено","хладно","топло","дъжд"],weather)}
    ${chipsHTML("occ",["уни","ежедневно","спорт","официално"],occ)}
    ${items.length?`<div class="outfit">${items.map(c=>clothTile(c,`<span class="tag">${esc(c.cat)}</span>`)).join("")}</div>`:`<div class="empty">Няма подходящи дрехи за това време. Добави още в Гардероб.</div>`}
    ${missing.length?`<div class="hint">Добави ${missing.join(" и ")} в гардероба за по-пълни комбинации.</div>`:""}
    ${hint?`<div class="hint">${esc(hint)}</div>`:""}
    <div class="row wrap"><button class="btn ghost sm" data-act="reroll">↻ Друга комбинация</button>${items.length?`<button class="btn ghost sm" data-act="to-builder">Промени</button><button class="btn sm" data-act="wear">Облякох го днес</button>`:""}</div>
  </div>`;
}

// ---------- uni helpers ----------
const toMin = t => { const [h,m]=(t||"0:0").split(":").map(Number); return h*60+m; };
const classesFor = d => S.classes.filter(c=>Number(c.day)===d).sort((a,b)=>toMin(a.start)-toMin(b.start));
const todaysClasses = () => classesFor(weekday(new Date()));
const upcoming = () => S.deadlines.filter(d=>!d.done).sort((a,b)=>a.date.localeCompare(b.date));
function duePill(date){
  const n = daysUntil(date);
  if (n<0) return `<span class="pill bad">изтекъл</span>`;
  if (n===0) return `<span class="pill bad">днес</span>`;
  if (n===1) return `<span class="pill bad">утре</span>`;
  return `<span class="pill ${n<=3?"bad":n<=7?"warn":""}"><span class="num">${n}</span> дни</span>`;
}
function classRow(c){
  return `<div class="item" data-class="${c.id}"><div class="time">${esc(c.start)}<br>${esc(c.end)}</div><span class="kind ${c.kind==="упражнение"?"ex":""}"></span>
    <div class="grow"><div class="t">${esc(c.subject)}</div><div class="m">${esc(c.kind)}${c.room?" · зала "+esc(c.room):""}${c.teacher?" · "+esc(c.teacher):""}</div></div></div>`;
}
function deadlineRow(d){
  return `<div class="item ${d.done?"done":""}"><button class="check ${d.done?"on":""}" data-toggle-dl="${d.id}" aria-label="Готово">${d.done?"✓":""}</button>
    <div class="grow" data-edit-dl="${d.id}"><div class="t">${esc(d.title)}</div><div class="m">${esc(d.kind)}${d.subject?" · "+esc(d.subject):""} · ${fmtDate(d.date,{weekday:"short",day:"numeric",month:"short"})}</div></div>
    ${d.done?"":duePill(d.date)}</div>`;
}

// ---------- budget helpers ----------
const monthKey = d => d.getFullYear()+"-"+pad(d.getMonth()+1);
const monthExpenses = () => S.expenses.filter(e=>(e.date||"").startsWith(monthKey(month)));
const sum = arr => arr.reduce((a,e)=>a+Number(e.amount||0),0);

// ---------- theme ----------
function hexLum(h){ const n=parseInt(String(h).slice(1),16); const f=c=>{c/=255; return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4);}; return .2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255); }
function applyTheme(t, mode, persist){
  if (persist===undefined) persist = !t;
  t = t || S.settings.theme || ls.get("sp-theme",null) || PRESETS[0];
  mode = mode || S.settings.mode || ls.get("sp-mode","auto");
  const r = document.documentElement;
  r.style.setProperty("--ua", t.a); r.style.setProperty("--ub", t.b);
  r.style.setProperty("--ua-ink", hexLum(t.a) > .42 ? "#1a1216" : "#ffffff");
  if (mode==="auto"){ if (r.dataset.spMode){ r.removeAttribute("data-theme"); delete r.dataset.spMode; } }
  else { r.setAttribute("data-theme", mode); r.dataset.spMode = "1"; }
  if (persist){ ls.set("sp-theme", t); ls.set("sp-mode", mode); }
}
const remindDays = () => Number(S.settings.remind || 3);

// ---------- monthly payments ----------
function addMonths(mk, n){ const [y,m]=mk.split("-").map(Number); return monthKey(new Date(y,m-1+n,1)); }
function dueISO(r, mk){ const [y,m]=mk.split("-").map(Number); const last=new Date(y,m,0).getDate(); return mk+"-"+pad(Math.min(Number(r.day)||1,last)); }
const recExpId = (r,mk) => "rec-"+r.id+"-"+mk;
async function recordRec(r, mk, date){
  const data = {amount:Number(r.amount), cat:r.cat||"Сметки", note:r.name+" (месечно)", date, ts:Date.now(), recId:r.id, recMonth:mk};
  if (app) return safe(app.collection("expenses").doc(recExpId(r,mk)).set(data));
  if (!S.expenses.some(e=>e.id===recExpId(r,mk))) S.expenses.push({id:recExpId(r,mk), ...data});
  render();
}
async function syncRecurring(){
  if (app && !(loaded.has("expenses") && loaded.has("recurring"))) return;
  const today = todayISO(), cur = monthKey(new Date()), floor = addMonths(cur,-11);
  for (const r of S.recurring){
    let mk = r.start || cur; if (mk < floor) mk = floor;
    for (; mk <= cur; mk = addMonths(mk,1)){
      const id = recExpId(r,mk);
      if (dueISO(r,mk) > today || attempted.has(id) || (r.skip||[]).includes(mk) || S.expenses.some(e=>e.id===id)) continue;
      attempted.add(id);
      await recordRec(r, mk, dueISO(r,mk));
    }
  }
}
function recStatus(r){
  const cur = monthKey(new Date());
  if (S.expenses.some(e=>e.id===recExpId(r,cur))) return {cls:"good", txt:"платено", paid:true};
  if ((r.skip||[]).includes(cur)) return {cls:"", txt:"пропуснато", paid:true};
  const n = daysUntil(dueISO(r,cur));
  if (n<=0) return {cls:"bad", txt:"днес", n:0};
  return {cls: n<=remindDays()?"warn":"", txt: n===1?"утре":`след ${n} дни`, n};
}
const upcomingPayments = () => S.recurring.map(r=>({r, s:recStatus(r)})).filter(x=>!x.s.paid && x.s.n<=remindDays()).sort((a,b)=>a.s.n-b.s.n);
async function delExpense(id){
  const e = S.expenses.find(x=>x.id===id);
  const r = e && e.recId && S.recurring.find(x=>x.id===e.recId);
  if (r) await safe(upd("recurring", r.id, {skip:[...(r.skip||[]).filter(m=>m!==e.recMonth), e.recMonth]}));
  return safe(del("expenses",id), r ? "Изтрито. Няма да се добави отново за този месец." : "Изтрито");
}

// ---------- calendar ----------
const eventsOn = d => S.events.filter(e=>e.date===d || (e.yearly && e.date.slice(5)===d.slice(5) && e.date<=d)).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
const paymentsOn = d => S.recurring.filter(r=>dueISO(r,d.slice(0,7))===d && (r.start||"")<=d.slice(0,7));

// ---------- deals ----------
const dealColor = c => "var(" + ((DEAL_CATS.find(x=>x[0]===c)||DEAL_CATS[5])[1]) + ")";
function dealOnDate(x, ds){
  if (x.until && x.until < ds) return false;
  if (x.kind==="once") return x.date===ds;
  return !(x.days && x.days.length) || x.days.includes(weekday(parse(ds)));
}
function dealNowInfo(x){
  const now = new Date(); if (!dealOnDate(x, iso(now))) return null;
  const t = now.getHours()*60 + now.getMinutes();
  if (!x.from) return {left:null};
  const f = toMin(x.from), to = x.to ? toMin(x.to) : null;
  if (t < f) return null;
  if (to===null || to<=f) return {left:null};
  return t < to ? {left: to - t} : null;
}
const dealLater = x => dealOnDate(x, todayISO()) && x.from && (new Date().getHours()*60+new Date().getMinutes()) < toMin(x.from);
function daysLabel(days){
  if (!days || !days.length || days.length===7) return "всеки ден";
  const k = [...days].sort((a,b)=>a-b).join(",");
  if (k==="1,2,3,4,5") return "Пн–Пт"; if (k==="6,7") return "събота и неделя";
  return [...days].sort((a,b)=>a-b).map(d=>DAYS[d-1]).join(", ");
}
function dealWhen(x){
  const time = x.from ? " · " + esc(x.from) + (x.to ? "–" + esc(x.to) : "") : "";
  return (x.kind==="once" ? fmtDate(x.date,{weekday:"short",day:"numeric",month:"short"}) : daysLabel(x.days)) + time;
}
const safeLink = u => /^https?:\/\//i.test(u||"") ? u : "";

      ${x.what?`<div class="m" style="color:var(--fg)">${esc(x.what)}</div>`:""}
      <div class="m">${esc(x.cat)} · ${dealWhen(x)}${x.area?" · "+esc(x.area):""}${x.student?" · със студентска карта":""}</div>
      ${link?`<a class="lnk" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Виж повече ↗</a>`:""}</div>
    <button class="heart ${x.fav?"on":""}" data-fav-deal="${x.id}" aria-label="${x.fav?"Махни от любими":"Добави в любими"}" aria-pressed="${!!x.fav}">♥</button></div>`;
}
const fmtLeft = m => m>=60 ? `още ${Math.floor(m/60)} ч${m%60?" "+(m%60)+" мин":""}` : `още ${m} мин`;
function liveDeals(){ return S.deals.map(x=>({x, info:dealNowInfo(x)})).filter(o=>o.info).sort((a,b)=>(b.x.fav?1:0)-(a.x.fav?1:0)); }

    ${later.length?`<section><h2>По-късно днес</h2><div class="list">${later.map(x=>dealCard(x)).join("")}</div></section>`:""}
    <section><h2>През седмицата</h2>
      <div class="chips">${DAYS.map((d,i)=>`<button class="chip" data-dday="${i+1}" aria-pressed="${dealDay===i+1}">${d}</button>`).join("")}</div>
      ${dayList.length?`<div class="list">${dayList.map(x=>dealCard(x)).join("")}</div>`:`<div class="empty">Няма оферти за ${fmtDate(sel,{weekday:"long"})}.</div>`}

function dealForm(x){

function renderCalendar(){

  for (let d=1; d<=days; d++){

    cells += `<button class="cd ${ds===today?"today":""}" data-cal-day="${ds}" aria-pressed="${ds===calSel}" aria-label="${fmtDate(ds,{day:"numeric",month:"long"})}${tot?", записи: "+tot:""}"><span class="n num">${d}</span><span class="dots">${ev?'<i class="d-ev"></i>':""}${dl?'<i class="d-dl"></i>':""}${py?'<i class="d-py"></i>':""}</span></button>`;

    <div class="cal"><div class="cal-h">${DAYS.map(d=>`<span>${d}</span>`).join("")}</div><div class="cal-g">${cells}</div>

    <section><h2>${fmtDate(calSel,{weekday:"long",day:"numeric",month:"long"})}</h2>
      ${(evs.length||dls.length||pys.length)?`<div class="list">
        ${evs.map(e=>`<div class="item" data-edit-ev="${e.id}"><div class="time">${e.time?esc(e.time):"цял<br>ден"}</div><span class="kind ev"></span><div class="grow"><div class="t">${esc(e.title)}</div><div class="m">${esc(e.kind)}${e.yearly?" · всяка година":""}${e.note?" · "+esc(e.note):""}</div></div></div>`).join("")}
        ${dls.map(deadlineRow).join("")}

  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const max = 1100, s = Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
    const cv = document.createElement("canvas"); cv.width=Math.round(img.naturalWidth*s); cv.height=Math.round(img.naturalHeight*s);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    return await new Promise(res=>cv.toBlob(res,"image/jpeg",0.82));
  } finally { URL.revokeObjectURL(url); }
}
function clothForm(){
  let blob = null;
  openSheet("Нова дреха", `<form class="form" id="f">
    ${assets?`<label class="f" for="w-photo">Снимка
      <div class="ph big-photo" id="w-prev"><span class="ini">📷</span></div>
      <input type="file" id="w-photo" accept="image/*"></label>`:`<div class="note">Снимките могат да се качват само от собственика на приложението. Дрехата ще се запише без снимка.</div>`}
    <label class="f" for="w-name">Име<input type="text" id="w-name" required placeholder="напр. Розов пуловер"></label>
    <div class="form" style="gap:8px"><span class="hint">Категория</span>${chipsHTML("cat",CLOTH_CATS,"Горнище")}</div>
    <div class="form" style="gap:8px"><span class="hint">За какво време</span>${chipsHTML("warm",WARMTH,"всякакво")}</div>
    <div class="form" style="gap:8px"><span class="hint">Стил</span>${chipsHTML("style",STYLES,"ежедневно")}</div>
    <button class="btn" type="submit" id="w-save">Добави в гардероба</button></form>`, root=>{
    wireChips(root);
    const fi = root.querySelector("#w-photo");
    if (fi) fi.onchange = async ()=>{
      const f = fi.files[0]; if (!f) return;
      try{ blob = await shrinkImage(f); const u = URL.createObjectURL(blob);
        root.querySelector("#w-prev").innerHTML = `<img src="${u}" alt="Преглед">`; }
      catch(e){ blob=null; toast("Тази снимка не може да се отвори. Опитай с JPG или PNG."); }
    };
    root.querySelector("#f").onsubmit = async e=>{ e.preventDefault();
      const name = root.querySelector("#w-name").value.trim(); if (!name) return;
      const btn = root.querySelector("#w-save"); btn.disabled=true; btn.textContent="Записвам…";
      let photo = null;
      if (blob && assets){
        try{ photo = (await assets.upload(blob,{type:"image/jpeg"})).id; }
        catch(err){ btn.disabled=false; btn.textContent="Добави в гардероба";
          toast(err&&err.code==="too_large"?"Снимката е твърде голяма.":err&&err.code==="quota_or_state"?"Мястото за снимки е запълнено.":"Снимката не се качи. Опитай пак."); return; }
      }
      closeSheet();
      safe(add("clothes",{name, cat:chipVal(root,"cat"), warmth:chipVal(root,"warm"), style:chipVal(root,"style"), photo, lastWorn:null, ts:Date.now()}), "Добавено в гардероба");
    };
  });
}
function clothDetail(id){
  const c = S.clothes.find(x=>x.id===id); if (!c) return;
  const u = photoURL(c);
  openSheet(c.name, `${u?`<div class="ph big-photo"><img src="${u}" alt="${esc(c.name)}"></div>`:""}
    <div class="row wrap"><span class="pill">${esc(c.cat)}</span><span class="pill">${esc(c.warmth)}</span><span class="pill">${esc(c.style)}</span></div>
    <p class="hint" style="margin:0">${c.lastWorn?`Последно облечена: ${fmtDate(c.lastWorn,{day:"numeric",month:"long"})} (преди <span class="num">${lastWornDays(c)}</span> дни)`:"Още не е отбелязана като облечена."}</p>
    <button class="btn" id="cd-wear">Облякох я днес</button>
    <button class="btn danger" id="cd-del">Изтрий от гардероба</button>`, root=>{
    root.querySelector("#cd-wear").onclick=()=>{ closeSheet(); safe(upd("clothes",c.id,{lastWorn:todayISO()}),"Отбелязано"); };
    const d = root.querySelector("#cd-del");
    d.onclick=async ()=>{
      if (d.dataset.sure!=="1"){ d.dataset.sure="1"; d.textContent="Сигурна ли си? Натисни пак"; return; }
      closeSheet(); await safe(del("clothes",c.id),"Изтрито");
      if (c.photo && assets){ try{ await assets.delete(c.photo); }catch(e){} }
    };
  });
}

// ---------- events ----------
document.addEventListener("click", async e=>{
  const t = e.target.closest("a,button,[data-edit-dl],[data-class],[data-edit-rec],[data-edit-ev],[data-edit-deal]");
  if (t && t.tagName==="A") return; if (!t || t.closest("#sheet-root")) return;
  const ds = t.dataset;
  if (ds.tab) return go(ds.tab);
  if (ds.go) return go(ds.go);
  if (ds.uni){ uniMode=ds.uni; return render(); }
  if (ds.day){ uniDay=Number(ds.day); return render(); }
  if (ds.cfilter){ closetFilter=ds.cfilter; return render(); }
  if (ds.cmode){ closetMode=ds.cmode; naming=false; return render(); }
  if (ds.slot){ const sl=SLOTS.find(s=>s[0]===ds.slot); const opts=[null,...S.clothes.filter(c=>sl[1].includes(c.cat)).map(c=>c.id)];
    const i=opts.indexOf(builder[ds.slot]); builder[ds.slot]=opts[(i+Number(ds.step)+opts.length)%opts.length]; return render(); }
  if (ds.loadOutfit){ const o=S.outfits.find(x=>x.id===ds.loadOutfit); if(o){ loadIds(o.ids); render(); window.scrollTo(0,0); } return; }
  if (ds.wearOutfit){ const o=S.outfits.find(x=>x.id===ds.wearOutfit); if(o){ for (const id of o.ids) if (S.clothes.some(c=>c.id===id)) await safe(upd("clothes",id,{lastWorn:todayISO()})); toast("„"+o.name+"“ е отбелязан"); } return; }
  if (ds.delOutfit){ if (t.dataset.sure!=="1"){ t.dataset.sure="1"; t.textContent="?"; t.setAttribute("aria-label","Натисни пак за изтриване"); return; } return safe(del("outfits",ds.delOutfit),"Тоалетът е изтрит"); }
  if (ds.cloth) return clothDetail(ds.cloth);
  if (ds.class) return classForm(S.classes.find(c=>c.id===ds.class));
  if (ds.editDl) return deadlineForm(S.deadlines.find(d=>d.id===ds.editDl));
  if (ds.toggleDl){ const d=S.deadlines.find(x=>x.id===ds.toggleDl); return safe(upd("deadlines",d.id,{done:!d.done})); }
  if (ds.toggleShop){ const s=S.shopping.find(x=>x.id===ds.toggleShop); return safe(upd("shopping",s.id,{done:!s.done})); }
  if (ds.delShop) return safe(del("shopping",ds.delShop));
  if (ds.delExp) return delExpense(ds.delExp);
  if (ds.calDay){ calSel = ds.calDay; return render(); }
  if (ds.dfilter){ dealFilter = ds.dfilter; return render(); }
  if (ds.dday){ dealDay = Number(ds.dday); return render(); }
  if (ds.favDeal){ const x=S.deals.find(v=>v.id===ds.favDeal); return x && safe(upd("deals",x.id,{fav:!x.fav})); }
  if (ds.editDeal) return dealForm(S.deals.find(v=>v.id===ds.editDeal));
  if (ds.editEv) return eventForm(S.events.find(x=>x.id===ds.editEv));
  if (ds.editRec) return recurringForm(S.recurring.find(x=>x.id===ds.editRec));
  if (ds.payRec){ const r=S.recurring.find(x=>x.id===ds.payRec); if (!r) return; const cur=monthKey(new Date());
    if ((r.skip||[]).includes(cur)) await safe(upd("recurring",r.id,{skip:r.skip.filter(m=>m!==cur)}));
    await recordRec(r, cur, todayISO()); toast("Записано в бюджета"); return; }
  switch(ds.act){
    case "mprev": month.setMonth(month.getMonth()-1); return render();
    case "mnext": month.setMonth(month.getMonth()+1); return render();
    case "limit": return limitForm();
    case "settings": return settingsForm();
    case "add-rec": return recurringForm();
    case "cprev": case "cnext": calMonth.setMonth(calMonth.getMonth() + (ds.act==="cprev"?-1:1));
      calSel = monthKey(calMonth)===monthKey(new Date()) ? todayISO() : monthKey(calMonth)+"-01"; return render();
    case "ctoday": calMonth = new Date(); calMonth.setDate(1); calSel = todayISO(); return render();
    case "reroll": makeOutfit(); return render();
    case "to-builder": loadIds(outfit?outfit.ids:[]); closetMode="combo"; return go("closet");
    case "combo-random": { const pick = cats => { const o=S.clothes.filter(c=>cats.includes(c.cat)); return o.length?o[Math.floor(Math.random()*o.length)].id:null; };
      builder = {top:pick(["Горнище","Рокля"]), bottom:pick(["Долнище"]), shoes:pick(["Обувки"]), outer:Math.random()<0.6?pick(["Връхна дреха"]):null, acc:Math.random()<0.5?pick(["Аксесоар"]):null}; return render(); }
    case "combo-clear": builder = {acc:null, outer:null, top:null, bottom:null, shoes:null}; return render();
    case "combo-save": naming=true; render(); setTimeout(()=>{ const i=$("#outfit-name"); if(i) i.focus(); },30); return;
    case "combo-wear": { for (const c of builderItems()) await safe(upd("clothes",c.id,{lastWorn:todayISO()})); toast("Тоалетът е отбелязан"); return; }
    case "wear": { const items = outfitItems(); for (const c of items) await safe(upd("clothes",c.id,{lastWorn:todayISO()})); toast("Тоалетът е отбелязан"); return; }
    case "finish": finishing=true; render(); setTimeout(()=>{ const i=$("#finish-amt"); if(i) i.focus(); },30); return;
    case "finish-cancel": finishing=false; return render();
    case "clear-checked": for (const s of S.shopping.filter(x=>x.done)) await safe(del("shopping",s.id)); return;
  }
});
document.addEventListener("submit", async e=>{
  if (e.target.id==="shop-form"){ e.preventDefault(); const i=$("#shop-input"); const v=i.value.trim(); if(!v) return; i.value="";
    return safe(add("shopping",{name:v, done:false, ts:Date.now()})); }
  if (e.target.id==="name-form"){ e.preventDefault();
    const name = ($("#outfit-name").value||"").trim() || "Тоалет "+(S.outfits.length+1);
    naming=false; render();
    return safe(add("outfits",{name, ids:builderItems().map(c=>c.id), ts:Date.now()}), "Тоалетът е запазен"); }
  if (e.target.id==="finish-form"){ e.preventDefault();
    const amount = Math.round(parseFloat(($("#finish-amt").value||"").replace(",","."))*100)/100;
    const items = S.shopping.filter(x=>x.done);
    finishing=false;
    if (amount>0) await safe(add("expenses",{amount, cat:"Храна", note:"Пазар: "+items.map(i=>i.name).slice(0,4).join(", ")+(items.length>4?"…":""), date:todayISO(), ts:Date.now()}));
    for (const s of items) await safe(del("shopping",s.id));
    toast(amount>0?"Записано в бюджета":"Списъкът е обновен"); render();
  }
});
$("#fab").onclick = ()=>{
  if (tab==="budget") return expenseForm();
  if (tab==="calendar") return eventForm();
  if (tab==="deals") return dealForm();
  if (tab==="uni") return uniMode==="schedule" ? classForm() : deadlineForm();
  if (tab==="closet") return clothForm();
};
document.addEventListener("keydown", e=>{ if (e.key==="Escape") closeSheet(); });

boot();
})();
